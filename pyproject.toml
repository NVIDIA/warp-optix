[build-system]
requires = [
    "scikit-build-core>=0.12",
    "pybind11>=3.0,<4",
    # Supplies cuda.h for the build only. The extension links no CUDA library.
    "nvidia-cuda-runtime-cu12==12.9.79",
]
build-backend = "scikit_build_core.build"

[project]
name = "warp-optix"
version = "0.2.0"
description = "Warp ray tracing with PyOptiX"
readme = "docs/pypi.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0 AND BSD-3-Clause AND LicenseRef-NVIDIA-OptiX"
license-files = ["LICENSE.md", "LICENSE.txt", "OptiX_LICENSE.txt", "THIRD_PARTY_NOTICES.txt", "licenses/*.txt"]
authors = [
    {name = "NVIDIA Corporation"},
]
keywords = ["optix", "ray-tracing", "nvidia", "cuda", "gpu", "rendering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

dependencies = ["pyoptix==9.1.1", "warp-lang>=1.17", "numpy>=1.20"]

[project.optional-dependencies]
training = ["warp-nn>=0.3.1"]
pathtracing = ["imageio>=2.31", "Pillow>=9", "pyglet>=2.1,<3"]
usd = [
    "usd-core>=25.5,<26.5; platform_machine != 'aarch64' and python_version < '3.14'",
    "usd-exchange>=2.2.0; platform_machine == 'aarch64' and python_version < '3.13'",
]
ui = ["imgui-bundle>=1.92", "PyOpenGL>=3.1"]

[project.urls]
Homepage = "https://github.com/NVIDIA/warp-optix"
Documentation = "https://github.com/NVIDIA/warp-optix/blob/main/warp_optix/README.md"
Repository = "https://github.com/NVIDIA/warp-optix"
Issues = "https://github.com/NVIDIA/warp-optix/issues"

[dependency-groups]
test = [
    "pytest>=7.0",
]
dev = [
    {include-group = "test"},
    "build",
    "twine",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/extensions/{wheel_tag}"
cmake.version = ">=3.17"
cmake.build-type = "Release"
ninja.version = ">=1.11"
wheel.packages = ["warp_optix/warp_optix"]
sdist.exclude = [
    ".claude", ".agents", ".codex", ".aws", ".venv", "env", "build", "dist",
    "third_party", "*.bmp", "**/*.egg-info", "**/.pytest_cache",
]

# Wheels are built by .github/workflows/gpu-platform.yml.
[tool.cibuildwheel]
# Keep in sync with requires-python.
build = ["cp312-*"]
# The NVIDIA driver and PyOptiX do not support musl.
skip = ["*-musllinux_*"]
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# PyOptiX publishes manylinux_2_28 wheels.
manylinux-x86_64-image = "manylinux_2_28"
# The extension loads the NVIDIA driver at runtime and links no CUDA library.
# Never bundle the driver of the build machine should a link to it be added.
repair-wheel-command = "auditwheel repair --exclude libcuda.so.1 -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# Bundle nothing: the NVIDIA driver and the Visual C++ Redistributable come
# from the user's machine.
repair-wheel-command = ""

[tool.pytest.ini_options]
testpaths = ["warp_optix/tests"]
python_files = "test_*.py"
markers = [
    "gpu: requires a CUDA GPU with an OptiX-capable driver",
    "slow: long-running test",
    "usd: requires the usd optional dependencies",
    "render: renders images and compares them against references",
    "training: requires the training extra (warp-nn)",
]

# Match Warp's Python formatting conventions.
[tool.ruff]
line-length = 120
indent-width = 4
extend-exclude = ["third_party", "build"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "I",    # isort
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",    # Line length is handled by the formatter
    "E741",    # Warp code often uses l as a variable name
    "F403",    # Allow wildcard imports
    "F405",    # Related to use of wildcard imports
    "F811",    # Warp kernels often use overloads
    "E721",    # Warp code compares float and int types with ==
    "B905",    # zip() without strict= is used throughout
    "UP018",   # Warp kernels often use float(val) and int(val)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# The package registers Warp modules before importing implementation symbols.
"warp_optix/warp_optix/__init__.py" = ["E402"]
# Tests adjust sys.path or skip on missing optional dependencies before importing.
"**/tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pyright]
include = ["warp_optix/warp_optix"]
# Resolve `warp_optix` to the package, not the repository directory of the same name.
executionEnvironments = [{ root = "warp_optix" }]
pythonVersion = "3.12"
# CI runs pyright without installing warp, pyoptix or the optional extras.
reportMissingImports = false
reportMissingModuleSource = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
# Warp kernel modules use Warp's own type system, and the modules below have
# existing type errors. Remove entries as they are cleaned up so that pyright
# gates more of the package over time.
exclude = [
    "warp_optix/warp_optix/_backend.py",
    "warp_optix/warp_optix/accel.py",
    "warp_optix/warp_optix/gl/line_overlay.py",
    "warp_optix/warp_optix/pathtracing/arrows.py",
    "warp_optix/warp_optix/pathtracing/asset_loaders.py",
    "warp_optix/warp_optix/pathtracing/denoising.py",
    "warp_optix/warp_optix/pathtracing/environment_map.py",
    "warp_optix/warp_optix/pathtracing/func_common.py",
    "warp_optix/warp_optix/pathtracing/pathtracer_api.py",
    "warp_optix/warp_optix/pathtracing/pathtracing_viewer.py",
    "warp_optix/warp_optix/pathtracing/pathtracing_warp_kernels.py",
    "warp_optix/warp_optix/pathtracing/scene.py",
    "warp_optix/warp_optix/pathtracing/sky_lut.py",
    "warp_optix/warp_optix/pathtracing/tonemap.py",
    "warp_optix/warp_optix/pathtracing/usd_loader.py",
    "warp_optix/warp_optix/pathtracing/viewer.py",
    "warp_optix/warp_optix/pathtracing/volume_composite.py",
]

[tool.typos.files]
extend-exclude = ["third_party", "uv.lock", "licenses", "*_LICENSE.txt", "LICENSE.*"]

[tool.typos.default.extend-words]
# Rendering terminology
lod = "lod"
mis = "mis"
metalness = "metalness"
# PTX instruction (set predicate), inspected in generated-code tests
setp = "setp"
# Unreal Engine material names (OmniUe4Translucent)
ue = "ue"
Ue = "Ue"
UE = "UE"
# Substring match for "emissive" / "emission" material parameter names
emiss = "emiss"
# Loop and index variables
iy = "iy"
OT = "OT"
# File extension of the material test asset
wnt = "wnt"

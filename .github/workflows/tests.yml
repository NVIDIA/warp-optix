name: GPU tests

on:
  push:
    branches:
      - main
      - develop
      # NVIDIA copy-pr-bot copies vetted PR commits to these branches.
      # Do not run pull_request events directly on the NVIDIA runners.
      - "pull-request/[0-9]+"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The NVIDIA GPU runner images ship without compilers or a CUDA Toolkit, so
  # wheels are built on GitHub-hosted runners and only tested on the GPU runners.
  build:
    name: Build wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true
      - name: Install CUDA Toolkit components
        shell: bash
        run: uv run --no-project python .github/scripts/install_cuda.py --platform ${{ matrix.platform }} --prefix "$RUNNER_TEMP/cuda"
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Upload wheel
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error

  test:
    name: Full suite / ${{ matrix.os-name }} RTX PRO 6000
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: Linux
            runner: linux-amd64-gpu-rtxpro6000-latest-1
            platform: linux-x86_64
          - os-name: Windows
            runner: windows-amd64-gpu-rtxpro6000-latest-1
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify NVIDIA GPU
        run: nvidia-smi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.platform }}
          path: dist
      - name: Install locked dependencies and the built wheel
        shell: bash
        run: |
          uv sync --locked --no-install-project --group test --extra pathtracing --extra ui --extra usd
          uv pip install --no-deps dist/*.whl
      - name: Cache Warp kernels
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/warp-kernel-cache
          # Keep platforms and dependencies separate. Restore the latest compatible
          # cache across commits; Warp hashes module contents to rebuild changed kernels.
          key: warp-kernels-v1-${{ matrix.runner }}-py3.12-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            warp-kernels-v1-${{ matrix.runner }}-py3.12-${{ hashFiles('uv.lock') }}-
      - name: Run full suite with CUDA required
        env:
          WARP_CACHE_PATH: ${{ runner.temp }}/warp-kernel-cache
        run: uv run --no-sync pytest warp_optix/tests examples_warp/neural_texture --require-cuda --junitxml=test-results/cuda.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tests-${{ matrix.platform }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

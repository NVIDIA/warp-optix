name: Lint

on:
  push:
    branches:
      - main
      - develop
      # NVIDIA copy-pr-bot copies vetted PR commits to these branches.
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Format, lint, spelling and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # The hooks do not need CUDA, a GPU or the warp-optix build.
      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure --color always

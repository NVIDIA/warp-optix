# Builds the wheel for one platform and tests it on that platform's GPU runner.
# Called once per platform so a failed build only skips its own GPU tests.

name: GPU platform

on:
  workflow_call:
    inputs:
      platform:
        description: Platform name for artifacts, e.g. linux-x86_64
        required: true
        type: string
      build-os:
        description: GitHub-hosted runner that builds the wheels
        required: true
        type: string
      gpu-runner:
        description: NVIDIA self-hosted GPU runner that tests the wheels
        required: true
        type: string
      release:
        description: Test release wheels without restoring or saving caches
        default: false
        type: boolean
    outputs:
      wheel-sha256:
        description: SHA-256 of the warp-optix wheel from the GitHub-hosted build
        value: ${{ jobs.build.outputs.wheel-sha256 }}

permissions:
  contents: read

jobs:
  # The NVIDIA GPU runner images ship without compilers, so wheels are built on
  # GitHub-hosted runners and only tested on the GPU runners. Building needs a
  # C++ compiler only: cuda.h comes from a pip build requirement and PyOptiX
  # from its PyPI wheel. Linux wheels are built in a manylinux container.
  build:
    name: Build wheels
    runs-on: ${{ inputs.build-os }}
    timeout-minutes: 30
    outputs:
      wheel-sha256: ${{ steps.wheel-hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Python version, manylinux policy and repair step are in pyproject.toml.
      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      # Export the digest directly from this hosted job, independently of the
      # artifact storage shared with the self-hosted test job.
      - name: Record warp-optix wheel hash
        id: wheel-hash
        shell: bash
        run: |
          wheels=(wheelhouse/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected one wheel, found ${wheels[*]}"
            exit 1
          fi
          echo "sha256=$(sha256sum "${wheels[0]}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload wheel
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheel-${{ inputs.platform }}
          path: wheelhouse/*.whl
          retention-days: 7
          if-no-files-found: error

  test:
    name: Full suite on RTX PRO 6000
    needs: build
    runs-on: ${{ inputs.gpu-runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify NVIDIA GPU
        run: nvidia-smi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: ${{ !inputs.release }}
      # The Windows runner image ships msvcp140.dll 14.0 from VS 2015.
      # Prebuilt wheels such as usd-core need 14.40 or later.
      - name: Install VC++ Redistributable
        if: runner.os == 'Windows'
        run: |
          $installer = "$env:RUNNER_TEMP\vc_redist.x64.exe"
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "Unexpected installer signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $process = Start-Process $installer -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "vc_redist.x64.exe failed with exit code $($process.ExitCode)" }
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ inputs.platform }}
          path: dist
      - name: Install locked dependencies and the built wheel
        shell: bash
        run: |
          uv sync --locked --no-install-project --group test --all-extras
          uv pip install --no-deps dist/*.whl
      - name: Cache Warp kernels
        if: ${{ !inputs.release }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/warp-kernel-cache
          # Keep platforms and dependencies separate. Restore the latest compatible
          # cache across commits; Warp hashes module contents to rebuild changed kernels.
          key: warp-kernels-v1-${{ inputs.gpu-runner }}-py3.12-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            warp-kernels-v1-${{ inputs.gpu-runner }}-py3.12-${{ hashFiles('uv.lock') }}-
      - name: Run full suite with CUDA required
        env:
          WARP_CACHE_PATH: ${{ runner.temp }}/warp-kernel-cache
        run: uv run --no-sync pytest warp_optix/tests examples/neural_texture --require-cuda --junitxml=test-results/cuda.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tests-${{ inputs.platform }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

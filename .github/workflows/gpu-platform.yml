# Builds wheels for one platform and tests them on that platform's GPU runner.
# Called once per platform so a failed build only skips its own GPU tests.

name: GPU platform

on:
  workflow_call:
    inputs:
      platform:
        description: CUDA redistributable platform, e.g. linux-x86_64
        required: true
        type: string
      build-os:
        description: GitHub-hosted runner that builds the wheels
        required: true
        type: string
      gpu-runner:
        description: NVIDIA self-hosted GPU runner that tests the wheels
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The NVIDIA GPU runner images ship without compilers or a CUDA Toolkit, so
  # wheels are built on GitHub-hosted runners and only tested on the GPU runners.
  build:
    name: Build wheels
    runs-on: ${{ inputs.build-os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true
      - name: Install CUDA Toolkit components
        shell: bash
        run: uv run --no-project python .github/scripts/install_cuda.py --platform ${{ inputs.platform }} --prefix "$RUNNER_TEMP/cuda"
      - name: Resolve locked PyOptiX source
        id: pyoptix
        shell: bash
        run: echo "hash=$(uv run --no-project python .github/scripts/fetch_locked_sdist.py pyoptix --print-hash)" >> "$GITHUB_OUTPUT"
      # PyOptiX only changes with its locked source, the CUDA version, or the
      # build settings in this workflow, so reuse its wheel across runs.
      - name: Restore PyOptiX wheel
        id: pyoptix-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: pyoptix-wheel
          key: pyoptix-wheel-v1-${{ inputs.platform }}-${{ steps.pyoptix.outputs.hash }}-${{ hashFiles('.github/scripts/install_cuda.py', '.github/workflows/gpu-platform.yml') }}
      - name: Build wheels
        shell: bash
        env:
          # The GPU runners have no CUDA runtime library to load at import time.
          SKBUILD_CMAKE_DEFINE: CUDA_cudart_LIBRARY=${{ env.CUDART_STATIC_LIBRARY }}
          # MSVC reads extra options from CL. PyOptiX's single pybind11 source
          # exceeds the default COFF section limit without /bigobj. The GPU
          # runners have no VC++ Redistributable, so also avoid the constexpr
          # std::mutex that crashes with an msvcp140.dll older than 14.40. Use
          # the dash form: Git Bash rewrites "/bigobj" into a Windows path.
          CL: ${{ startsWith(inputs.platform, 'windows') && '-bigobj -D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR' || '' }}
          PYOPTIX_CACHED: ${{ steps.pyoptix-cache.outputs.cache-hit }}
        run: |
          uv build --wheel --out-dir dist
          # PyPI publishes PyOptiX only as an sdist; build the locked one here.
          if [ "$PYOPTIX_CACHED" != true ]; then
            sdist=$(uv run --no-project python .github/scripts/fetch_locked_sdist.py pyoptix --out-dir "$RUNNER_TEMP/sdist")
            uv build --wheel --out-dir pyoptix-wheel "$sdist"
          fi
          cp pyoptix-wheel/*.whl dist/
      - name: Save PyOptiX wheel
        if: steps.pyoptix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: pyoptix-wheel
          key: ${{ steps.pyoptix-cache.outputs.cache-primary-key }}
      - name: Upload wheels
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheel-${{ inputs.platform }}
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error

  test:
    name: Full suite on RTX PRO 6000
    needs: build
    runs-on: ${{ inputs.gpu-runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify NVIDIA GPU
        run: nvidia-smi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ inputs.platform }}
          path: dist
      - name: Install locked dependencies and the built wheels
        shell: bash
        run: |
          uv sync --locked --no-install-project --no-install-package pyoptix --group test --all-extras
          uv pip install --no-deps dist/*.whl
      - name: Show MSVC runtime
        if: runner.os == 'Windows'
        run: |
          $dirs = @("$env:SystemRoot\System32", (uv run --no-sync python -c "import sys; print(sys.base_prefix)"))
          Get-ChildItem $dirs -Filter 'msvcp140*.dll' | Format-Table FullName, @{n = 'Version'; e = { $_.VersionInfo.ProductVersion } } -AutoSize
      - name: Cache Warp kernels
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/warp-kernel-cache
          # Keep platforms and dependencies separate. Restore the latest compatible
          # cache across commits; Warp hashes module contents to rebuild changed kernels.
          key: warp-kernels-v1-${{ inputs.gpu-runner }}-py3.12-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            warp-kernels-v1-${{ inputs.gpu-runner }}-py3.12-${{ hashFiles('uv.lock') }}-
      - name: Run full suite with CUDA required
        env:
          WARP_CACHE_PATH: ${{ runner.temp }}/warp-kernel-cache
        run: uv run --no-sync pytest warp_optix/tests examples_warp/neural_texture --require-cuda --junitxml=test-results/cuda.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tests-${{ inputs.platform }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

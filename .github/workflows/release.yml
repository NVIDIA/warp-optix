name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build and test Linux wheel
    if: github.repository == 'NVIDIA/warp-optix'
    uses: ./.github/workflows/gpu-platform.yml
    with:
      platform: linux-x86_64
      build-os: ubuntu-24.04
      gpu-runner: linux-amd64-gpu-rtxpro6000-latest-1
      release: true

  windows:
    name: Build and test Windows wheel
    if: github.repository == 'NVIDIA/warp-optix'
    uses: ./.github/workflows/gpu-platform.yml
    with:
      platform: windows-x86_64
      build-os: windows-2022
      gpu-runner: windows-amd64-gpu-rtxpro6000-latest-1
      release: true

  prepare:
    name: Validate release distributions
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: false
      # Build the sdist before anything is downloaded into the checkout.
      - name: Build the source distribution
        run: uv build --sdist --out-dir sdist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-linux-x86_64
          path: wheels/linux-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-windows-x86_64
          path: wheels/windows-x86_64
      - name: Verify the wheels and match the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          LINUX_WHEEL_SHA256: ${{ needs.linux.outputs.wheel-sha256 }}
          WINDOWS_WHEEL_SHA256: ${{ needs.windows.outputs.wheel-sha256 }}
        run: |
          uv run --no-project python -I - <<'PY'
          import hashlib
          import os
          import shutil
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          expected_tag = os.environ["RELEASE_TAG"]
          out = Path("publish-dist")
          out.mkdir()


          def check(name, metadata):
              if metadata["Name"] != "warp-optix":
                  raise SystemExit(f"{name}: unexpected distribution {metadata['Name']}")
              if expected_tag != f"v{metadata['Version']}":
                  raise SystemExit(f"Tag must be v{metadata['Version']}, got {expected_tag}")


          # Each wheel must be exactly what its GitHub-hosted build job produced.
          for platform, pattern, digest_env in (
              ("linux-x86_64", "warp_optix-*-cp312-cp312-*manylinux_2_28_x86_64.whl", "LINUX_WHEEL_SHA256"),
              ("windows-x86_64", "warp_optix-*-cp312-cp312-win_amd64.whl", "WINDOWS_WHEEL_SHA256"),
          ):
              wheels = list(Path("wheels", platform).glob(pattern))
              if len(wheels) != 1:
                  raise SystemExit(f"Expected one {pattern}, found {[w.name for w in wheels]}")
              wheel = wheels[0]
              if hashlib.sha256(wheel.read_bytes()).hexdigest() != os.environ[digest_env]:
                  raise SystemExit(f"{wheel.name} does not match the GitHub-hosted build output")
              with zipfile.ZipFile(wheel) as archive:
                  (metadata_file,) = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
                  check(wheel.name, BytesParser().parsebytes(archive.read(metadata_file)))
              shutil.copy2(wheel, out / wheel.name)

          (sdist,) = Path("sdist").glob("warp_optix-*.tar.gz")
          with tarfile.open(sdist) as archive:
              (pkg_info,) = [m for m in archive.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO")]
              check(sdist.name, BytesParser().parsebytes(archive.extractfile(pkg_info).read()))
          shutil.copy2(sdist, out / sdist.name)
          PY
      - name: Check package metadata
        run: uvx twine==7.0.0 check --strict publish-dist/*
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pypi-distributions
          path: publish-dist/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/warp-optix
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build and test Linux wheel
    if: github.repository == 'NVIDIA/warp-optix'
    uses: ./.github/workflows/gpu-platform.yml
    with:
      platform: linux-x86_64
      build-os: ubuntu-24.04
      gpu-runner: linux-amd64-gpu-rtxpro6000-latest-1
      release: true

  windows:
    name: Build and test Windows wheel
    if: github.repository == 'NVIDIA/warp-optix'
    uses: ./.github/workflows/gpu-platform.yml
    with:
      platform: windows-x86_64
      build-os: windows-2022
      gpu-runner: windows-amd64-gpu-rtxpro6000-latest-1
      release: true

  prepare:
    name: Validate release distributions
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: false
      # Build the sdist before anything is downloaded into the checkout.
      - name: Build the source distribution
        run: uv build --sdist --out-dir sdist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-linux-x86_64
          path: wheels/linux-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-windows-x86_64
          path: wheels/windows-x86_64
      # Stage the distributions only if their version matches the tag and each
      # wheel is exactly what its GitHub-hosted build job produced.
      - name: Verify the distributions and match the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          LINUX_WHEEL_SHA256: ${{ needs.linux.outputs.wheel-sha256 }}
          WINDOWS_WHEEL_SHA256: ${{ needs.windows.outputs.wheel-sha256 }}
        run: |
          version=$(uv version --short)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag must be v$version, got $RELEASE_TAG"
            exit 1
          fi
          mkdir publish-dist
          stage() {
            echo "$2  $1" | sha256sum --check --strict
            cp "$1" publish-dist/
          }
          stage wheels/linux-x86_64/warp_optix-"$version"-cp312-cp312-*manylinux_2_28_x86_64.whl "$LINUX_WHEEL_SHA256"
          stage wheels/windows-x86_64/warp_optix-"$version"-cp312-cp312-win_amd64.whl "$WINDOWS_WHEEL_SHA256"
          cp sdist/warp_optix-"$version".tar.gz publish-dist/
      - name: Check package metadata
        run: uvx twine==7.0.0 check --strict publish-dist/*
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pypi-distributions
          path: publish-dist/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/warp-optix
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

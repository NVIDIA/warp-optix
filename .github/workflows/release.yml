name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and test Windows wheel
    if: github.repository == 'NVIDIA/warp-optix'
    uses: ./.github/workflows/gpu-platform.yml
    with:
      platform: windows-x86_64
      build-os: windows-2022
      gpu-runner: windows-amd64-gpu-rtxpro6000-latest-1

  prepare:
    name: Validate release wheel
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-windows-x86_64
          path: wheels
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
      # The CI bundle also contains PyOptiX. Publish only our own distribution.
      - name: Select warp-optix and match the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python -I - <<'PY'
          import os
          import shutil
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          wheels = list(Path("wheels").glob("warp_optix-*-cp312-cp312-win_amd64.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one Windows CPython 3.12 warp-optix wheel, found {len(wheels)}")
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              metadata_files = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_files) != 1:
                  raise SystemExit("Expected exactly one wheel METADATA file")
              metadata = BytesParser().parsebytes(archive.read(metadata_files[0]))
          if metadata["Name"] != "warp-optix":
              raise SystemExit(f"Unexpected distribution: {metadata['Name']}")
          expected_tag = f"v{metadata['Version']}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"Tag must be {expected_tag}, got {os.environ['RELEASE_TAG']}")
          Path("publish-dist").mkdir()
          shutil.copy2(wheel, Path("publish-dist") / wheel.name)
          PY
      - name: Check package metadata
        run: uvx twine check --strict publish-dist/*.whl
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pypi-distributions
          path: publish-dist/*.whl
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/warp-optix
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
